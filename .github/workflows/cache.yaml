name: Cache

on:
  workflow_call:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
            warm_ci: true
          - os: macos-15-intel
            target: x86_64-apple-darwin
            warm_ci: false
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust 1.97.1 toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # 1.97.1
        with:
          toolchain: 1.97.1
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: build
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build CI artifacts
        if: github.ref == 'refs/heads/main' && matrix.warm_ci
        run: cargo test --locked --workspace --all-targets --all-features --no-run
      - name: Build release binary
        if: github.ref == 'refs/heads/main'
        run: cargo build --locked --release --package orvek --bin orvek --target ${{ matrix.target }}
        env:
          ORVEK_RELEASE_BUILD: "1"
