name: Release

on:
  push:
    tags:
      - "v*"

env:
  BINARY_NAME: orvek
  CARGO_TERM_COLOR: always

jobs:
  validate:
    name: Validate Release
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify tag matches crate version on main
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main:refs/remotes/origin/main

          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Tagged commit $GITHUB_SHA is not on main" >&2
            exit 1
          fi

          crate_version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "orvek") | .version')
          tag_version="${GITHUB_REF_NAME#v}"

          if [[ "$tag_version" != "$crate_version" ]]; then
            echo "Tag version $tag_version does not match crate version $crate_version" >&2
            exit 1
          fi

      - name: Require successful CI for the tagged commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release_sha=$(git rev-parse HEAD)
          conclusion=$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yaml/runs?head_sha=${release_sha}&event=push&branch=main&per_page=1" \
            --jq '.workflow_runs[0].conclusion // "missing"')
          if [[ "$conclusion" != "success" ]]; then
            echo "Release blocked: main CI for ${release_sha} is ${conclusion}" >&2
            exit 1
          fi

  build:
    name: Build ${{ matrix.target }}
    needs: validate
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
            archive_ext: tar.gz
          - os: macos-15-intel
            target: x86_64-apple-darwin
            archive_ext: tar.gz
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set reproducible build epoch
        shell: bash
        run: echo "SOURCE_DATE_EPOCH=$(git show -s --format=%ct "$GITHUB_SHA")" >> "$GITHUB_ENV"
      - name: Install Rust 1.97.1 toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # 1.97.1
        with:
          toolchain: 1.97.1
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: build
          save-if: false
      - name: Build with Cargo twice and compare artifacts
        shell: bash
        run: |
          set -euo pipefail
          cargo build --locked --release --package orvek --bin orvek --target "${{ matrix.target }}"
          first="${RUNNER_TEMP}/orvek-first"
          cp "target/${{ matrix.target }}/release/${BINARY_NAME}" "$first"
          cargo clean --package orvek
          cargo build --locked --release --package orvek --bin orvek --target "${{ matrix.target }}"
          cmp "$first" "target/${{ matrix.target }}/release/${BINARY_NAME}"
        env:
          ORVEK_RELEASE_BUILD: "1"
      - name: Package binary
        shell: bash
        run: |
          set -euo pipefail
          package_name="${BINARY_NAME}-${{ matrix.target }}-${GITHUB_REF_NAME}"

          mkdir "$package_name"
          cp "target/${{ matrix.target }}/release/${BINARY_NAME}" "$package_name/"
          cp README.md LICENSE.md "$package_name/"
          python3 scripts/package-release.py \
            --source "$package_name" \
            --output "$package_name.${{ matrix.archive_ext }}" \
            --epoch "$SOURCE_DATE_EPOCH"
          shasum -a 256 "$package_name.${{ matrix.archive_ext }}" > "$package_name.${{ matrix.archive_ext }}.sha256"
      - name: Upload packaged binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.target }}
          path: |
            ${{ env.BINARY_NAME }}-${{ matrix.target }}-${{ github.ref_name }}.${{ matrix.archive_ext }}
            ${{ env.BINARY_NAME }}-${{ matrix.target }}-${{ github.ref_name }}.${{ matrix.archive_ext }}.sha256
          if-no-files-found: error

  review_assets:
    name: Build Review Assets
    needs: validate
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    defaults:
      run:
        working-directory: web/review
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set reproducible build epoch
        shell: bash
        run: echo "SOURCE_DATE_EPOCH=$(git show -s --format=%ct "$GITHUB_SHA")" >> "$GITHUB_ENV"
      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build review assets
        shell: bash
        run: ORVEK_VERSION="${GITHUB_REF_NAME#v}" bun run build
      - name: Typecheck review app
        run: bun run typecheck
      - name: Package review assets
        shell: bash
        run: |
          set -euo pipefail

          archive="orvek-review-${GITHUB_REF_NAME}.tar.gz"
          mkdir review
          cp -R dist/. review/
          python3 ../../scripts/package-release.py \
            --source review \
            --output "$archive" \
            --epoch "$SOURCE_DATE_EPOCH"
          shasum -a 256 "$archive" > "${archive}.sha256"
      - name: Upload packaged review assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: review-assets
          path: |
            web/review/orvek-review-${{ github.ref_name }}.tar.gz
            web/review/orvek-review-${{ github.ref_name }}.tar.gz.sha256
          if-no-files-found: error

  sign:
    name: Sign Release Assets
    needs: [build, review_assets]
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true
      - name: Install rsign2
        uses: taiki-e/install-action@c44f6b046f1c29ae5918b1e0bfdbb2f1813836fd # v2
        with:
          tool: rsign2@0.6.0
      - name: Sign binary artifacts
        shell: bash
        run: |
          set -euo pipefail

          trap 'rm -f minisign.key minisign.pub' EXIT
          rsign generate -f -W -p minisign.pub -s minisign.key
          echo "::add-mask::$(tail -n 1 minisign.key)"

          {
            printf '\n[package.metadata.binstall.signing]\n'
            printf 'algorithm = "minisign"\n'
            printf 'pubkey = "%s"\n' "$(tail -n 1 minisign.pub)"
          } >> bin/orvek/Cargo.toml
          cp minisign.pub dist/minisign.pub

          for archive in dist/*.tar.gz; do
            rsign sign -W -s minisign.key -x "${archive}.sig" "${archive}"
          done
      - name: Verify signed release assets
        shell: bash
        run: |
          set -euo pipefail

          cd dist
          for archive in *.tar.gz; do
            test -s "$archive"
            test -s "${archive}.sha256"
            test -s "${archive}.sig"
            shasum -a 256 --check "${archive}.sha256"
            rsign verify "$archive" -P "$(tail -n 1 minisign.pub)" -x "${archive}.sig"
          done

          test "$(find . -maxdepth 1 -name '*.tar.gz' | wc -l | tr -d ' ')" = "3"
      - name: Upload signed release bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: signed-release
          path: |
            Cargo.toml
            bin/orvek/Cargo.toml
            dist
          if-no-files-found: error

  publish_crates:
    name: Publish Crates
    needs: sign
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download signed release bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: signed-release
          path: ${{ runner.temp }}/signed-release
      - name: Install Rust 1.97.1 toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # 1.97.1
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: build
          save-if: false
      - name: Publish crates in dependency order
        shell: bash
        run: |
          set -euo pipefail

          publish_package() {
            local package="$1"
            shift
            local version
            local crate
            local local_checksum
            local published_checksum

            version=$(cargo metadata --locked --no-deps --format-version 1 | jq -r ".packages[] | select(.name == \"${package}\") | .version")
            crate="target/package/${package}-${version}.crate"
            test -f "$crate"
            local_checksum=$(sha256sum "$crate" | cut -d ' ' -f 1)

            for attempt in {1..5}; do
              if cargo publish --locked --no-verify -p "$package" "$@"; then
                return 0
              fi

              if [[ "$attempt" -lt 5 ]]; then
                sleep $((attempt * 15))
              fi
            done

            published_checksum=$(curl --fail --silent --show-error \
              --retry 6 --retry-delay 5 --retry-all-errors \
              --user-agent "orvek-release-workflow/${version} (https://github.com/pkmdev-sec/orvek)" \
              "https://crates.io/api/v1/crates/${package}/${version}" \
              | jq -er '.version.checksum')

            if [[ "$published_checksum" != "$local_checksum" ]]; then
              echo "crates.io has different contents for ${package} ${version}" >&2
              return 1
            fi

            echo "cargo publish reported failure, but crates.io has the exact packaged ${package} crate"
          }

          cargo package --locked -p orvek-memory
          publish_package orvek-memory

          cp "${RUNNER_TEMP}/signed-release/bin/orvek/Cargo.toml" bin/orvek/Cargo.toml
          for attempt in {1..10}; do
            if cargo package --locked --allow-dirty -p orvek; then
              break
            fi

            if [[ "$attempt" = 10 ]]; then
              exit 1
            fi

            sleep 15
          done

          publish_package orvek --allow-dirty
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  release:
    name: Publish GitHub Release
    needs: publish_crates
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Download signed release bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: signed-release
          path: .
      - name: Install git-cliff
        uses: taiki-e/install-action@c44f6b046f1c29ae5918b1e0bfdbb2f1813836fd # v2
        with:
          tool: git-cliff@2.13.1
          fallback: none
      - name: Generate release notes
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          cp .github/RELEASE_TEMPLATE.md release-notes.md
          printf '\n\n' >> release-notes.md
          git cliff --current --strip all >> release-notes.md
      - name: Publish release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          body_path: release-notes.md
          files: |
            dist/*.tar.gz
            dist/*.sha256
            dist/*.sig
            dist/minisign.pub
          fail_on_unmatched_files: true

